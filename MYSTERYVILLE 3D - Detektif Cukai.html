<title>MYSTERYVILLE 3D — Detektif Cukai</title><style>
:root{--panel:#fffdf6;--ink:#1f3142;--muted:#5d6f7e;--chip:rgba(255,253,244,.94);--chipBorder:#ffffff;--accent:#0f7c80;--soft:#edf6f4;--softBorder:#a9d9d5;--notice:#eef6fb;--scrim:rgba(7,27,42,.62);--shadow:0 6px 22px rgba(16,34,43,.22);color-scheme:light;
--sT:env(safe-area-inset-top,0px);--sB:env(safe-area-inset-bottom,0px);--sL:env(safe-area-inset-left,0px);--sR:env(safe-area-inset-right,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#132430;--ink:#e6eef3;--muted:#9db0bd;--chip:rgba(19,36,48,.92);--chipBorder:#2c4a5c;--accent:#5fd6cc;--soft:#1b3443;--softBorder:#2f5466;--notice:#1a3140;--scrim:rgba(0,8,14,.72);color-scheme:dark}}
:root[data-theme="dark"]{--panel:#132430;--ink:#e6eef3;--muted:#9db0bd;--chip:rgba(19,36,48,.92);--chipBorder:#2c4a5c;--accent:#5fd6cc;--soft:#1b3443;--softBorder:#2f5466;--notice:#1a3140;--scrim:rgba(0,8,14,.72);color-scheme:dark}
:root{box-sizing:border-box;padding-top:var(--sT);padding-bottom:var(--sB)}*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#9fd3e6;font-family:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0}canvas{display:block}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 16px;background:#15a4a0;color:#fff;font-weight:800;box-shadow:0 4px 0 #0c6869;min-height:44px;touch-action:manipulation}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #0c6869}button:focus-visible,input:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
button.secondary{background:#516b82;box-shadow:0 4px 0 #334758}button.gold{background:#f2b53d;color:#3d2a05;box-shadow:0 4px 0 #b27a16}button.big{font-size:18px;padding:14px 20px}
.chip{background:var(--chip);color:var(--ink);border:2px solid var(--chipBorder);border-radius:14px;padding:7px 12px;box-shadow:var(--shadow);font-weight:800}
#hud{position:fixed;top:calc(var(--sT) + 10px);left:calc(var(--sL) + 10px);right:calc(var(--sR) + 10px);display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:3}
#hudLeft{flex:none;font-size:13px;line-height:1.3}#mission{flex:1;min-width:0;font-size:13px;font-weight:700;line-height:1.35}
#hudRight{display:flex;gap:6px;align-items:center;pointer-events:auto}#stars{color:#a46504;white-space:nowrap}.sep{opacity:.4}
.iconBtn{width:44px;height:44px;padding:0;font-size:20px;background:var(--chip);color:var(--ink);border:2px solid var(--chipBorder);box-shadow:var(--shadow)}
#quickNav{position:fixed;left:calc(var(--sL) + 10px);top:calc(var(--sT) + 72px);display:flex;gap:6px;z-index:3}
.navBtn{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--chip);color:var(--ink);border:2px solid var(--chipBorder);box-shadow:var(--shadow);font-size:14px}
#map{position:fixed;right:calc(var(--sR) + 10px);bottom:calc(var(--sB) + 10px);padding:5px;border-radius:14px;background:var(--chip);border:2px solid var(--chipBorder);box-shadow:var(--shadow);z-index:3;cursor:pointer}
#minimap{width:140px;height:110px;border-radius:9px}
#helpbar{position:fixed;left:calc(var(--sL) + 10px);bottom:calc(var(--sB) + 10px);max-width:min(460px,calc(100vw - 200px));font-size:12px;font-weight:700;background:var(--chip);color:var(--ink);padding:8px 12px;border-radius:12px;pointer-events:none;z-index:2}
#joyBase{display:none;position:fixed;left:calc(var(--sL) + 26px);bottom:calc(var(--sB) + 26px);width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.6);box-shadow:0 4px 18px rgba(0,0,0,.18);pointer-events:none;z-index:2}
#joyBase.active{background:rgba(255,255,255,.24)}#joyKnob{position:absolute;left:33px;top:33px;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.88);box-shadow:0 2px 8px rgba(0,0,0,.25)}
body.touch #joyBase{display:block}body.touch #helpbar{left:50%;transform:translateX(-50%);bottom:auto;top:calc(var(--sT) + 122px);opacity:.92;max-width:calc(100vw - 24px);text-align:center}
#actionBtn{position:fixed;left:50%;bottom:calc(var(--sB) + 22px);transform:translateX(-50%);z-index:4;background:#f2b53d;color:#3d2a05;box-shadow:0 4px 0 #b27a16;font-size:15px;padding:12px 20px}
body.touch #actionBtn{font-size:17px;padding:16px 26px;bottom:calc(var(--sB) + 40px)}
#toast{position:fixed;left:50%;top:calc(var(--sT) + 120px);transform:translateX(-50%);background:rgba(20,47,64,.93);color:#fff;padding:11px 18px;border-radius:14px;z-index:6;font-weight:800;display:none;text-align:center;max-width:88vw;pointer-events:none}
.modalwrap{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:calc(var(--sT) + 12px) calc(var(--sR) + 12px) calc(var(--sB) + 12px) calc(var(--sL) + 12px);z-index:10}
.hidden{display:none!important}
.panel{width:min(660px,100%);max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--panel);color:var(--ink);border-radius:22px;padding:22px;box-shadow:0 20px 80px rgba(0,0,0,.45);-webkit-user-select:text;user-select:text}
.panel h1{margin:0 0 8px;font-size:clamp(23px,4.6vw,34px);color:var(--accent);line-height:1.15}.panel h2{margin:0 0 10px;color:var(--accent);font-size:clamp(19px,3.8vw,24px)}.panel h3{margin:14px 0 6px}
.panel p{line-height:1.6}.muted{color:var(--muted);font-size:13px}.qtext{font-weight:800;font-size:17px;line-height:1.5}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.menuGrid{display:grid;grid-template-columns:1fr 1fr}.menuGrid .big{grid-column:1/-1}
.choices{display:grid;gap:9px}.choices button{min-height:52px;text-align:left;background:var(--soft);color:var(--ink);border:2px solid var(--softBorder);box-shadow:none;font-weight:700;line-height:1.4}
.pill{display:inline-block;padding:5px 10px;background:#e8f5e7;border-radius:100px;font-size:12px;font-weight:800;color:#267451;margin-bottom:6px}
.notice{background:var(--notice);padding:12px;border-radius:12px;margin:12px 0;line-height:1.55}
.levelgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px;margin:14px 0}.levelgrid button{padding:12px 6px;font-size:15px;line-height:1.3}.levelgrid button.locked{background:#a9b0b8;box-shadow:none}
button small{display:block;font-size:11px;font-weight:700;opacity:.9;margin-top:3px}
.progress{height:10px;background:#dbe9e7;border-radius:10px;overflow:hidden;margin-bottom:12px}.progress div{height:100%;background:#21b49d}
.evidenceGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.evidenceGrid button{min-height:110px;background:var(--soft);color:var(--ink);box-shadow:none;border:2px solid var(--softBorder);font-size:15px;line-height:1.5}
.caseintro{background:linear-gradient(135deg,#243b63,#326f7d);color:#fff;border-radius:18px;padding:18px}.caseintro h2{color:#ffdf87}
.hero{text-align:center;background:linear-gradient(135deg,#193b65,#157e87);color:#fff;border-radius:18px;padding:16px 12px 14px;margin-bottom:14px}.hero h1{color:#ffe28e;margin:4px 0 0;font-size:clamp(28px,7vw,42px);letter-spacing:1px}.hero p{margin:2px 0 0;opacity:.9}
.heroArt{display:flex;justify-content:center;align-items:flex-end;height:96px}.heroArt img{height:92px;margin:0 -6px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}.heroArt img:nth-child(odd){height:84px}
.langRow{display:flex;justify-content:center;margin:-2px 0 6px}
.seg{display:inline-flex;background:var(--soft);border:2px solid var(--softBorder);border-radius:14px;padding:3px;gap:3px;flex-wrap:wrap}.seg button{background:transparent;color:var(--ink);box-shadow:none;min-height:38px;padding:7px 12px;font-size:14px}.seg button.on{background:#15a4a0;color:#fff}
.setRow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--softBorder);font-weight:800}.setRow.sub{font-weight:600;padding-top:0}.setRow input[type=range]{flex:1;min-width:150px;max-width:260px;accent-color:#15a4a0}
.charStage{display:flex;align-items:center;justify-content:center;gap:10px}.charShow{position:relative;height:clamp(170px,32vh,240px);width:clamp(140px,40vw,200px);display:flex;align-items:flex-end;justify-content:center}
.charShow img{position:relative;z-index:1;max-height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}.charFloor{position:absolute;bottom:-6px;left:15%;right:15%;height:22px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.28),rgba(0,0,0,0) 70%)}
.charCaption{text-align:center;margin:10px 0 12px}.charCaption b{display:block;font-size:20px;color:var(--accent)}.charCaption span{font-size:13px;color:var(--muted)}
.charGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.charCard{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;background:var(--soft);color:var(--ink);border:2px solid var(--softBorder);box-shadow:none;border-radius:14px}
.charCard img{height:clamp(54px,11vw,78px);object-fit:contain}.charCard span{font-size:12px}.charCard.on{border-color:#15a4a0;background:#d8f3ef;color:#0b4f52;transform:translateY(-2px)}
.field{display:block;margin-top:14px;font-weight:800}.field input{display:block;width:100%;margin-top:6px;min-height:48px;font:inherit;font-size:16px;font-weight:700;border-radius:12px;border:2px solid var(--softBorder);padding:8px 12px;background:var(--panel);color:var(--ink);-webkit-user-select:text;user-select:text}
.howto{padding-left:20px;line-height:1.65}.howto li{margin:4px 0}
.mapCanvas{width:100%;height:auto;border-radius:14px;border:3px solid var(--softBorder);margin:6px 0 12px;display:block}
.mapList{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.mapItem{padding:10px;border:2px solid var(--softBorder);border-radius:12px;background:var(--soft);font-size:12px;line-height:1.5}.mapItem b{font-size:14px}.mapItem.target{border-color:#e5b42c;background:#fff1ba;color:#3d2a05}
.certificate{position:relative;text-align:center;background:linear-gradient(135deg,#fffdf2,#fff7df);color:#2b2b2b;border:9px double #cfa343;border-radius:10px;padding:24px 14px;box-shadow:inset 0 0 0 3px #fff5ce}.certificate h1{color:#aa771a}.certificate h2{color:#6b5a2e}
.certificate .awardtitle{font-size:clamp(25px,5vw,40px);letter-spacing:2px;margin:12px 0}
.certificate.gold{border-color:#d3a12c}.certificate.gold .awardtitle{color:#b47d0b}.certificate.silver{border-color:#8c9eaf}.certificate.silver .awardtitle{color:#66798d}.certificate.bronze{border-color:#b87a50}.certificate.bronze .awardtitle{color:#98572c}.certificate.participation{border-color:#5eaaa1}.certificate.participation .awardtitle{color:#34867e}
@page{margin:6mm}
@media print{html,body{height:auto!important;overflow:visible!important;background:#fff!important}:root{padding:0!important}body>*:not(#modal){display:none!important}
#modal{position:static!important;inset:auto!important;background:#fff!important;padding:0!important;display:block!important}
#panel{width:100%!important;max-height:none!important;overflow:visible!important;box-shadow:none!important;padding:0!important;border-radius:0!important;background:#fff!important}
#panel>*:not(.certWrap){display:none!important}.certLoading{display:none!important}
.certImg{box-shadow:none!important;border-radius:0!important;width:100%!important;max-width:none!important;max-height:none!important;height:calc(100vh - 2px)!important;object-fit:contain;margin:0!important}.certImg.land{display:block!important}.certImg.port{display:none!important}}

.certWrap{position:relative}.certImg{display:block;width:100%;height:auto;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.22);background:#fff8e6;min-height:140px}.certImg.port{display:none}

.medal{font-size:54px}

#coach.top{top:calc(var(--sT) + 112px)}#coach.bottom{bottom:calc(var(--sB) + 150px)}#coach .cStep{font-size:12px;color:#9a6a06;font-weight:900}#coach .cText{margin:4px 0 8px;font-size:15px}

{q:'Amir buys a qualifying RM1,500 computer and RM400 of books. What is the total before the limit?',a:['RM1,900','RM2,500','RM900'],h:'Add both receipts together.',why:'RM1,500 + RM400 = RM1,900, which is below the RM2,500 limit.'},
{q:'Amir wants to claim his gym membership and internet bill in the same category. Is that correct?',a:['Yes, both are in the same category','No, the gym is in additional sports, the internet is in lifestyle','Both are EV relief'],h:'Tell regular lifestyle apart from additional sports.',why:'The document separates the lifestyle category from the additional sports lifestyle category.'}

{title:'Family Duty',who:'Sofia — Caring for Her Parents',story:'Sofia pays for her mother’s treatment and helps her family. Not every receipt has the same conditions.',
lesson:'Parent-related relief needs specific conditions, including a medical practitioner confirming the health condition for the listed expenses. The document states a limit of RM8,000 with a RM1,000 sub-limit for parents’ complete medical examinations. Basic supporting equipment for persons with disabilities has its own category.',
questions:[
{q:'Sofia has receipts for her mother’s treatment. Which evidence matters for the parents’ treatment category?',a:['Confirmation by a medical practitioner','A photo of the house only','A supermarket membership card'],h:'Look for the condition about the parent’s health.',why:'The document says the health condition must be confirmed by a medical practitioner.'},
{q:'The specific limit for parents’ complete medical examination in the document is…',a:['RM8,000 with no sub-limit','RM1,000','RM10,000'],h:'The overall limit and the sub-limit are not the same thing.',why:'Parents’ complete medical examination has a RM1,000 sub-limit.'},
{q:'Basic supporting equipment for a family member with a disability should be checked under…',a:['EV charging facilities','Basic supporting equipment for persons with disabilities','Sports fees'],h:'This category mentions support equipment for people with disabilities.',why:'The document has a basic supporting equipment category with its own limit.'},
{q:'Sofia’s mother has a RM1,400 complete medical examination. What sub-limit is stated?',a:['RM1,400','RM1,000','RM8,000'],h:'A complete examination has its own sub-limit.',why:'The sub-limit for parents’ complete medical examination is RM1,000.'},
{q:'Sofia pays for her mother’s dental treatment. What should be checked?',a:['Parents’ treatment conditions and evidence','The colour of the appointment card','The toothpaste brand'],h:'Parents relief includes dental treatment, subject to conditions.',why:'The document includes parents’ dental treatment in the related category.'},
{q:'Basic supporting equipment is bought for Sofia’s father, who has a disability. What is the category limit in the document?',a:['RM6,000','RM2,500','RM350'],h:'The support equipment category has a specific limit.',why:'The listed limit for basic supporting equipment is RM6,000.'},
{q:'Sofia herself is a person with a disability. The document lists relief for a disabled individual of…',a:['RM1,000','RM6,000','RM8,000'],h:'Tell disabled individual relief apart from support equipment.',why:'The document lists RM6,000 for a disabled individual.'},
{q:'Sofia pays for her own vaccination. Which category is relevant?',a:['Medical expenses with a vaccination sub-limit','SSPN','Childcare fees'],h:'Look for the vaccination category.',why:'Vaccination is listed under medical expenses, with a RM1,000 sub-limit.'},
{q:'A qualifying mental health examination or consultation belongs to the category…',a:['Related health examinations','EV charger','Breastfeeding equipment'],h:'Look for the mental health examination category.',why:'The document lists mental health examinations or consultations in a group limited to RM1,000.'},
{q:'Sofia has RM12,000 of receipts for medical expenses that all qualify in a category limited to RM10,000. What is the maximum?',a:['RM12,000','RM10,000','RM2,000'],h:'The maximum limit cannot be exceeded.',why:'If everything qualifies in that category, the stated maximum is RM10,000.'}
]},
{title:'Family Matters',who:'Hakim — Family Man',story:'Hakim has young children and family members who need learning support. Check ages, status and documents.',
lesson:'The document lists child relief, registered childcare/kindergarten fees, breastfeeding equipment, SSPN net savings, spouse, disabled spouse and disabled child relief. Conditions such as age, study status, registration of the care centre and who is eligible to claim must be checked. Not every relief can be claimed at the same time.',
questions:[
{q:'Whether a child’s childcare fees qualify is assessed based on…',a:['The colour of the childcare building','The child’s age and the centre’s registration status','The number of toys'],h:'Check two things: age and registration.',why:'The document mentions children aged six and below and a registered childcare centre/kindergarten.'},
{q:'SSPN: save RM6,000 and withdraw RM1,500 in the same year. What are the net savings?',a:['RM7,500','RM6,000','RM4,500'],h:'Net savings = savings minus withdrawals.',why:'RM6,000 − RM1,500 = RM4,500, before considering other conditions.'},
{q:'A 20-year-old child studying full time: what is the most accurate action?',a:['Automatically claim every child relief','Check the type of study, status and the child category conditions','No documents are needed'],h:'Relief for adult children has several sub-categories.',why:'The adult child categories have different education, status and recognition conditions.'},
{q:'Hakim’s child is 5 years old and attends a registered kindergarten. Which category is relevant?',a:['Childcare/kindergarten fees','EV charger','Retirement scheme'],h:'Check the age and the registration.',why:'The document lists registered childcare/kindergarten fees for children aged six and below.'},
{q:'Qualifying kindergarten fees are RM3,600. What is the category limit in the document?',a:['RM3,600','RM3,000','RM2,000'],h:'The childcare/kindergarten fee limit is RM3,000.',why:'The claim is limited to RM3,000 based on the document.'},
{q:'Breastfeeding equipment of RM1,200 meets the conditions. What is the limit?',a:['RM1,000','RM1,200','RM3,000'],h:'There is a RM1,000 limit.',why:'Breastfeeding equipment is limited to RM1,000, once every two years of assessment.'},
{q:'Hakim saves RM7,000 in SSPN and withdraws RM2,000 in the same year. What are the net savings?',a:['RM9,000','RM7,000','RM5,000'],h:'Subtract the withdrawal from the savings.',why:'RM7,000 − RM2,000 = RM5,000.'},
{q:'Hakim’s child is 17. The basic category for a child under 18 in the document is…',a:['RM2,000','RM8,000','RM350'],h:'Check category 16a.',why:'The document lists RM2,000 for a child under 18 years old.'},
{q:'A 19-year-old child is doing a full-time diploma. What should be checked?',a:['Claim straight away without evidence','Status, study and institution recognition conditions','Age only'],h:'The adult child category has extra conditions.',why:'Eligibility for adult children depends on study, status and institution conditions.'},
{q:'A 10-year-old child is receiving intervention for a learning disability. What is the related category limit in the document?',a:['RM4,000','RM1,000','RM350'],h:'Look for the learning assessment/intervention category.',why:'The document lists a RM4,000 limit for certain expenses for children aged 18 and below.'}
]},
{title:'Future Planning',who:'Nadia — Career & EV',story:'Nadia works, studies part-time, contributes to EPF and installs an EV charger at home.',
lesson:'The document lists own education fees, life insurance and EPF, private retirement schemes, education/medical insurance, SOCSO and EV charging facilities. The EV charger category has a RM2,500 limit for certain expenses for the taxpayer’s own vehicle, not business use. The price of an EV is not EV charger relief.',
questions:[
{q:'Nadia buys a RM90,000 EV and installs a RM3,100 home charger. Which is relevant to the EV charging facilities category?',a:['The RM90,000 car price','Qualifying charging costs, subject to the RM2,500 limit','Both, with no limit'],h:'Tell the car apart from the charging facility.',why:'The document’s category covers charging facilities, not the vehicle price.'},
{q:'SOCSO contributions should go under the category…',a:['SOCSO','SSPN savings','Sports lifestyle'],h:'The category name matches the contribution name.',why:'SOCSO is listed as a separate relief category.'},

{q:'Nadia installs a RM3,400 EV charger for her own car. If it qualifies, what is the claim limit?',a:['RM3,400','RM2,500','RM90,000'],h:'The EV charger limit is RM2,500.',why:'EV charging facilities have a RM2,500 limit in the document.'},
{q:'An EV charger is used only for a business vehicle. Can it be claimed under the personal category?',a:['Yes','No, the category excludes business use','Yes, if the car is new'],h:'Notice the business use.',why:'The document states EV charging facilities are for the taxpayer’s own vehicle, not business use.'},
{q:'What is the limit for private retirement schemes and deferred annuities in the document?',a:['RM3,000','RM8,000','RM350'],h:'The private retirement category has its own limit.',why:'The listed limit is RM3,000.'},
{q:'What is the SOCSO contribution limit in the document?',a:['RM350','RM3,000','RM7,000'],h:'Look for the SOCSO category.',why:'The document lists a RM350 limit for SOCSO.'},
{q:'What is the education and medical insurance limit in the document?',a:['RM3,000','RM10,000','RM2,500'],h:'Don’t confuse it with life insurance and EPF.',why:'The document lists RM3,000 for education and medical insurance.'},
{q:'Nadia takes an upskilling course. What sub-limit is stated under own education fees?',a:['RM7,000 with no sub-limit','RM2,000','RM350'],h:'Check the upskilling course sub-category.',why:'The document lists a RM2,000 sub-limit for upskilling or self-enhancement courses.'},
{q:'For life insurance and EPF, the document splits the RM7,000 limit into…',a:['RM4,000 and RM3,000','RM6,000 and RM1,000','RM5,000 and RM5,000'],h:'Check the two components in category 17.',why:'The document states components limited to RM4,000 and RM3,000, subject to the relevant conditions.'}

{title:'The Final Audit',who:'Big Case — All Residents',story:'The final audit! There are valid receipts, ineligible ones and ones over the limit. Use what you learned in every level.',
lesson:'Review: relief depends on the type of expense, family relationship, age, status, documents, year of assessment and limits/sub-limits. The document also covers medical expenses, vaccination, mental health, learning diagnosis/intervention, insurance, disabled children and other categories. Never claim the same expense twice.',
questions:[
{q:'Someone has a receipt for buying an EV but no charging facility costs. What is the best decision?',a:['Claim the car price as a charger','Do not claim the car price under the EV charger category','Claim it twice'],h:'Ask: what does category 21 actually cover?',why:'Category 21 covers EV charging facilities, not the price of the car.'},
{q:'A taxpayer wants to claim the same receipt in two categories. What is the right action?',a:['Allow the double claim','Check the categories and avoid double claiming','Throw away all documents'],h:'One expense should not be counted twice.',why:'Avoid double claims; check eligibility for each category.'},

{q:'The document shows a RM1,000 sub-limit for certain examinations. What does a sub-limit mean?',a:['Every claim is automatically RM1,000','That component has a RM1,000 maximum even if the main category may be higher','RM1,000 is the tax payable'],h:'A sub-limit is the maximum for a specific component.',why:'A sub-limit caps the claim for that component.'},
{q:'A RM2,800 receipt for books and a computer qualifies in the lifestyle category. What is the maximum?',a:['RM2,800','RM2,500','RM1,000'],h:'The lifestyle limit is RM2,500.',why:'The lifestyle category is limited to RM2,500.'},
{q:'You find an invoice for buying an EV for RM80,000. Is the car price part of EV charger relief?',a:['Yes','No','Only if it is green'],h:'Category 21 is specifically for charging facilities.',why:'The price of an EV is not part of the EV charging facilities category.'},

{q:'A taxpayer has receipts for parents’ treatment but no health confirmation. What should be done?',a:['Approve it straight away','Request and check the required confirmation documents','Throw away all receipts'],h:'Medical evidence matters.',why:'Confirmation by a medical practitioner is a stated condition for the parents’ treatment category.'},
{q:'A taxpayer has EPF contributions and life insurance. What is the most accurate step?',a:['Add everything with no limit','Check the RM4,000 and RM3,000 component limits','Put it under lifestyle'],h:'Category 17 has two components.',why:'The document separates the component limits in the life insurance and EPF category.'},
{q:'Someone has a child under 18 and an adult child who is studying. How is child relief decided?',a:['Use the same category without checking','Check each child against the conditions in categories 16a–16c','Based only on the child’s name'],h:'Age and education status matter.',why:'Child categories differ by age, status and education.'}
]}

// ---------- Pixabay MP3 integration (fails safely when files are absent) ----------
const PixabayAudio=(()=>{
  // This exported HTML is a standalone page: place /sounds beside this HTML.
  // Hosting with a build tool? Copy MP3s to public/sounds/ (served as /sounds/).
  const base='sounds/';
  const files={background:'background.mp3',city:'city.mp3',step:'footsteps.mp3',click:'click.mp3',correct:'correct.mp3',wrong:'wrong.mp3',levelUp:'success.mp3'};
  const audios={};const ready={};let unlocked=false,isWalking=false;
  const modes={background:'music',city:'music',step:'sfx',click:'sfx',correct:'sfx',wrong:'sfx',levelUp:'sfx'};
  for(const [name,file] of Object.entries(files)){
    const a=new Audio(base+file);a.preload='auto';
    a.loop=name==='background'||name==='city'||name==='step';audios[name]=a;ready[name]=false;
    a.addEventListener('canplay',()=>{
      const first=!ready[name];ready[name]=true;
      if(first){applyVolumes();if(unlocked&&a.loop)startLoops();if(name==='background'&&typeof Sound!=='undefined')Sound.applyVolumes();}
    });
    a.addEventListener('error',()=>{ready[name]=false;if(name==='background'&&typeof Sound!=='undefined')Sound.applyVolumes();});
  }
  function available(name){return !!ready[name]}
  function applyVolumes(){
    for(const [name,a] of Object.entries(audios)){
      const isMusic=modes[name]==='music';
      const allowed=isMusic?settings.music:settings.sfx;
      const vol=isMusic?settings.musicVol:settings.sfxVol;
      a.volume=allowed?Math.max(0,Math.min(1,vol*(name==='city'?.3:name==='background'?.45:name==='step'?.48:.8))):0;
      if(!allowed&&(name==='background'||name==='city'||name==='step'))a.pause();
    }
    if(unlocked){startLoops();syncFootsteps();}
  }
  function startLoops(){
    if(!unlocked||document.hidden||!settings.music)return;
    for(const n of ['background','city']){
      if(!ready[n])continue;
      const a=audios[n];if(a.paused)a.play().catch(()=>{});
    }
  }
  function syncFootsteps(){
    const a=audios.step;
    if(!a)return;
    const shouldPlay=isWalking&&unlocked&&ready.step&&settings.sfx&&settings.sfxVol>0&&!document.hidden;
    if(shouldPlay){if(a.paused)a.play().catch(()=>{});}
    else if(!a.paused){a.pause();try{a.currentTime=0;}catch(_){}}
  }
  function setWalking(walking){
    const next=!!walking;
    if(isWalking!==next){isWalking=next;syncFootsteps();}
  }
  function unlock(){unlocked=true;applyVolumes();startLoops();syncFootsteps()}
  function playEffect(name){
    // Footsteps MP3 is controlled continuously by movement, not restarted for each step.
    if(name==='step')return !!ready.step;
    if(!settings.sfx||!unlocked||!ready[name]||!audios[name]||audios[name].loop)return false;
    const a=audios[name];
    try{a.pause();a.currentTime=0;a.play().catch(()=>{});return true;}catch(_){return false;}
  }
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){for(const a of Object.values(audios))if(a.loop)a.pause()}
    else if(unlocked){startLoops();syncFootsteps();}
  });
  return{unlock,applyVolumes,available,playEffect,setWalking};
})();

// ---------- Bunyi & muzik (Pixabay MP3 dengan sintesis sebagai sandaran) ----------
const Sound=(()=>{
  let ctx=null,sfxBus,musicBus,verb,noiseBuf,musicFilter,timer=null,nextTime=0,step=0,playing=false;
  function ensure(){
    if(ctx)return ctx;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
    ctx=new AC();const comp=ctx.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3;comp.connect(ctx.destination);
    sfxBus=ctx.createGain();musicBus=ctx.createGain();musicBus.gain.value=0;sfxBus.connect(comp);
    musicFilter=ctx.createBiquadFilter();musicFilter.type='lowpass';musicFilter.frequency.value=2600;musicFilter.connect(musicBus);musicBus.connect(comp);
    verb=ctx.createConvolver();const len=ctx.sampleRate*2.8,b=ctx.createBuffer(2,len,ctx.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4)}verb.buffer=b;
    const vg=ctx.createGain();vg.gain.value=.32;verb.connect(vg);vg.connect(comp);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    applyVolumes();return ctx;
  }
  function applyVolumes(){PixabayAudio.applyVolumes();if(!ctx)return;const n=ctx.currentTime;musicBus.gain.setTargetAtTime(settings.music&&!PixabayAudio.available('background')?settings.musicVol*.6:0,n,.4);sfxBus.gain.setTargetAtTime(settings.sfx?settings.sfxVol:0,n,.05);if(settings.music)startMusic()}
  function unlock(){PixabayAudio.unlock();if(!ensure())return;if(ctx.state==='suspended')ctx.resume();if(settings.music)startMusic()}
  function voice(f,at,dur,vol,{type='sine',attack=.006,dest=sfxBus,wet=0,fEnd=0,detune=0}={}){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,at);if(fEnd)o.frequency.exponentialRampToValueAtTime(fEnd,at+dur);o.detune.value=detune;
    g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol,at+attack);g.gain.exponentialRampToValueAtTime(.0001,at+dur);
    o.connect(g);g.connect(dest);if(wet){const w=ctx.createGain();w.gain.value=wet;g.connect(w);w.connect(verb)}o.start(at);o.stop(at+dur+.05);
  }
  function noise(at,dur,vol,freq,q,type='bandpass'){const s=ctx.createBufferSource();s.buffer=noiseBuf;const f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=ctx.createGain();g.gain.setValueAtTime(vol,at);g.gain.exponentialRampToValueAtTime(.0001,at+dur);s.connect(f);f.connect(g);g.connect(sfxBus);s.start(at,Math.random()*.8);s.stop(at+dur+.02)}
  const FX={
    step(surface){const n=ctx.currentTime,r=.92+Math.random()*.16,toe=n+.055+Math.random()*.015;
      if(surface==='grass'){noise(n,.16,.12,1100*r,.7);noise(n+.03,.12,.07,3200*r,.8,'highpass');voice(62*r,n,.08,.07,{fEnd:42})}
      else if(surface==='wood'){voice(150*r,n,.11,.17,{type:'triangle',fEnd:105});noise(n,.04,.12,900*r,1.4);voice(190*r,toe,.08,.08,{type:'triangle',fEnd:140});noise(toe,.03,.07,1300*r,1.4)}
      else if(surface==='tile'){noise(n,.03,.2,3300*r,2.5);voice(85*r,n,.05,.08,{fEnd:55});noise(toe,.025,.11,4200*r,2.5)}
      else{voice(78*r,n,.07,.15,{fEnd:48});noise(n,.05,.17,1500*r,1.1);noise(toe,.06,.07,3600*r,.8,'highpass')}},
    ching(){const n=ctx.currentTime;[1568,2349.3,3136].forEach((f,i)=>voice(f,n+i*.012,1.5-i*.35,.16/(i+1),{wet:.55}));voice(4186,n+.03,.5,.04,{wet:.4})},
    click(){voice(1250,ctx.currentTime,.06,.1,{type:'triangle'})},
    correct(){const n=ctx.currentTime;[523.25,659.25,783.99,1046.5].forEach((f,i)=>voice(f,n+i*.085,.5,.18,{type:'triangle',wet:.35}));[1318.5,1568,2093].forEach((f,i)=>voice(f,n+.36+i*.06,.6,.06,{wet:.5}))},
    wrong(){const n=ctx.currentTime;voice(330,n,.24,.12,{type:'triangle',fEnd:300});voice(330,n,.24,.035,{type:'square',fEnd:300});voice(233,n+.22,.5,.13,{type:'triangle',fEnd:196});voice(233,n+.22,.5,.035,{type:'square',fEnd:196})},
    nope(){const n=ctx.currentTime;voice(392,n,.12,.1,{type:'triangle'});voice(349,n+.1,.18,.1,{type:'triangle'})},
    door(){const n=ctx.currentTime;voice(659.25,n,1.1,.12,{wet:.5});voice(1318.5,n,.6,.03,{wet:.4});voice(523.25,n+.32,1.4,.12,{wet:.5});voice(1046.5,n+.32,.7,.03,{wet:.4})},
    evidence(){const n=ctx.currentTime;voice(600,n,.6,.08,{fEnd:1800,wet:.5});[1760,2217,2637,3520].forEach((f,i)=>voice(f,n+.12+i*.07,.5,.05,{wet:.6}))},
    levelUp(){const n=ctx.currentTime;[[523.25,659.25,783.99],[587.33,739.99,880],[659.25,830.61,987.77],[1046.5,1318.5,1568]].forEach((c,i)=>c.forEach(f=>voice(f,n+i*.18,i===3?1.4:.3,.09,{type:'triangle',wet:.4})))},
    walkSignal(){const n=ctx.currentTime;for(let i=0;i<3;i++)voice(1975,n+i*.14,.06,.05,{type:'square'})}
  };
  function play(name,arg){if(!settings.sfx)return;if(PixabayAudio.playEffect(name))return;if(!ctx||ctx.state!=='running')return;try{FX[name]&&FX[name](arg)}catch(e){}}
  // Muzik latar asal: petikan gitar akustik yang tenang (sintesis Karplus–Strong), 68 BPM
  const mtof=m=>440*Math.pow(2,(m-69)/12),HALF=60/68/2,KS={};
  const CHORDS=[[41,57,60,64,67],[43,59,62,64,67],[40,55,59,62,67],[45,52,55,60,64]],PICK=[0,2,3,1,4,3,2,3];
  function ksBuf(m){if(KS[m])return KS[m];const sr=ctx.sampleRate,f=mtof(m),len=Math.floor(sr*3.4),b=ctx.createBuffer(1,len,sr),d=b.getChannelData(0),N=Math.max(2,Math.round(sr/f)),q=new Float32Array(N);
    for(let i=0;i<N;i++)q[i]=Math.random()*2-1;for(let p=0;p<2;p++)for(let i=1;i<N;i++)q[i]=(q[i]+q[i-1])*.5;
    const decay=Math.pow(.5,1/(f*1.5));let idx=0;for(let i=0;i<len;i++){const a=q[idx],nb=q[(idx+1)%N];d[i]=a;q[idx]=(a+nb)*.5*decay;idx=(idx+1)%N}
    for(let i=0;i<2000;i++)d[len-1-i]*=i/2000;return KS[m]=b}
  function pluck(m,at,vol){const s=ctx.createBufferSource();s.buffer=ksBuf(m);const g=ctx.createGain();g.gain.value=vol;s.connect(g);g.connect(musicFilter);const w=ctx.createGain();w.gain.value=.35;g.connect(w);w.connect(verb);s.start(at)}
  function playStep(s,at){
    const bar=Math.floor(s/8),k=s%8,ch=CHORDS[Math.floor(bar/2)%4],hum=(Math.random()-.5)*.016;
    if(k===0){pluck(ch[0],at,.32);if(bar%2===0)for(const m of ch.slice(1))voice(mtof(m),at,HALF*16+1.5,.018,{attack:1.8,dest:musicFilter,wet:.35})}
    else if(Math.random()<.92)pluck(ch[PICK[k]],at+Math.max(0,hum),.15+Math.random()*.05);
    if(bar%2===1&&(k===0||k===4)&&Math.random()<.55){const m=ch[1+Math.floor(Math.random()*4)]+12;voice(mtof(m),at,2.4,.03,{dest:musicFilter,wet:.6})}
  }
  function schedule(){if(!ctx||!playing)return;if(nextTime<ctx.currentTime)nextTime=ctx.currentTime+.05;while(nextTime<ctx.currentTime+.6){playStep(step,nextTime);step++;nextTime+=HALF}}

  function stopMusic(){playing=false;clearInterval(timer)}

  return{unlock,play,applyVolumes,stopMusic,startMusic,ready:()=>!!ctx&&ctx.state==='running'};
})();

  show(`<span class="pill">${t('ev.found')} • ${name}</span><h2>${ev.objects[i]}</h2><p>${t('ev.before')}</p><p class="qtext">${ev.question}</p><div class="choices">${ev.a.map((a,j)=>`<button onclick="answerEvidence('${name}',${j})">${String.fromCharCode(65+j)}. ${a}</button>`).join('')}</div>`,null)};
window.answerEvidence=(name,i)=>{
  const ev=evidenceFor(name);if(!evidencePicked)return;
  if(i!==ev.ok){Sound.play('wrong');toast(t('toast.evWrong'));return}
  Sound.play('correct');evidencePicked=false;Tut.event('evidenceDone');
  if(evidenceMode==='explore'){
    const first=!discoveredLocations.includes(name);
    if(first){discoveredLocations.push(name);store.set('mysteryville_discovered_locations',discoveredLocations);state.stars+=1;save()}
    show(`<h2>${t('ev.explored',{name})} ${first?'+1 ⭐':'✅'}</h2><p>${ev.why}</p><div class="notice">${t('ev.count',{n:discoveredLocations.length})}</div><div class="actions">${btn(t('ev.walk'),'closeModal()')} ${btn(t('ev.seeLoc'),'openTownMap()','secondary')}</div>`);return;
  }

  if(state.stage!==1||l.stops[state.visited.length]!==name){close();return}

};

const solids=[];

// Kawasan bertingkat (kaki lima, plaza, lot bangunan) berada pada y=0; jalan raya dan rumput pada y=-0.15.
const raised=[];

// ---------- Papan tanda (canvas) ----------
function signTexture({title,sub='',bg='#1d3557',fg='#ffffff',accent='#f4d35e',w=1024,h=256,border=true}){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.fillStyle=bg;g.fillRect(0,0,w,h);
  const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'rgba(255,255,255,.14)');gr.addColorStop(.5,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(0,0,0,.18)');g.fillStyle=gr;g.fillRect(0,0,w,h);
  if(border){g.strokeStyle=accent;g.lineWidth=Math.max(6,h*.04);g.strokeRect(h*.06,h*.06,w-h*.12,h-h*.12)}
  g.textAlign='center';g.textBaseline='middle';g.fillStyle=fg;
  g.font=`900 ${sub?h*.4:h*.5}px "Trebuchet MS","Segoe UI",Arial,sans-serif`;
  g.fillText(title,w/2,sub?h*.4:h*.53,w*.9);
  if(sub){g.font=`700 ${h*.19}px "Trebuchet MS","Segoe UI",Arial,sans-serif`;g.fillStyle=accent;g.fillText(sub,w/2,h*.76,w*.86)}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=MAX_ANISO;return t;
}
function signMesh(tex,w,h,glow=.28){
  const m=new THREE.MeshStandardMaterial({map:tex,roughness:.6,emissive:0xffffff,emissiveMap:tex,emissiveIntensity:glow});
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m);return mesh;
}
function labelSprite(text,bg='#1f6f5c',fg='#ffffff'){
  const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d');
  g.fillStyle=bg;g.beginPath();g.roundRect(6,6,500,116,30);g.fill();g.strokeStyle='#ffffff';g.lineWidth=8;g.stroke();
  g.fillStyle=fg;g.font='900 54px "Trebuchet MS",Arial,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(text,256,66,470);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false,fog:false}));sp.renderOrder=20;sp.scale.set(7,1.75,1);return sp;
}

// ---------- Pembina dinding dengan bukaan (tingkap/pintu) ----------
function wallX(B,key,color,x1,x2,y1,y2,z,t,openings){
  const xs=[x1,x2];for(const o of openings)xs.push(Math.max(x1,o.x1),Math.min(x2,o.x2));xs.sort((a,b)=>a-b);
  for(let i=0;i<xs.length-1;i++){
    const a=xs[i],c=xs[i+1];if(c-a<1e-3)continue;const mid=(a+c)/2;
    const ops=openings.filter(o=>mid>o.x1&&mid<o.x2).sort((p,q)=>p.y1-q.y1);
    let y=y1;for(const o of ops){if(o.y1>y)B.box(c-a,o.y1-y,t,key,color,mid,(y+o.y1)/2,z);y=Math.max(y,o.y2)}
    if(y2>y)B.box(c-a,y2-y,t,key,color,mid,(y+y2)/2,z);
  }
}
function windowFill(B,o,z,t,frame,grille){
  const w=o.x2-o.x1,h=o.y2-o.y1,cx=(o.x1+o.x2)/2,cy=(o.y1+o.y2)/2;

  B.box(w+.24,.16,t+.12,'matte',frame,cx,o.y2+.08,z);B.box(w+.4,.2,t+.3,'matte',frame,cx,o.y1-.1,z+.06);

  if(grille)for(let gx=o.x1+.3;gx<o.x2-.15;gx+=.36)B.box(.05,h-.1,.05,'metal',0x2e3338,gx,cy,z+t/2+.04);
}

// ---------- Pembina bangunan umum ----------
function makeBuilding(o){
  const b=Object.assign({t:.5,a:0,dw:4.2,doorX:0,uH:5,floors:1,wallKey:'plaster',floorKey:'tile',floorCol:0xf2f2f2,innerCol:0xf4efe6,trimCol:0xf7f4ec,frameCol:0x3b4651,enterable:true,mission:true,front:'shop',roof:'flat',upperBlock:true},o);
  b.fz=b.d/2-b.a;b.dh=b.dh||Math.min(4.7,b.gH-1.3);
  b.H=b.gH+(b.floors-1)*b.uH;b.topH=b.H+1.5;
  b.cos=Math.round(Math.cos(b.rot));b.sin=Math.round(Math.sin(b.rot));
  b.toW=(lx,lz)=>[b.x+lx*b.cos+lz*b.sin,b.z-lx*b.sin+lz*b.cos];
  b.toL=(wx,wz)=>{const dx=wx-b.x,dz=wz-b.z;return[dx*b.cos-dz*b.sin,dx*b.sin+dz*b.cos]};
  b.solid=(x1,x2,z1,z2)=>{const p=b.toW(x1,z1),q=b.toW(x2,z2);solidRect(p[0],q[0],p[1],q[1])};
  b.solidC=(x,z,r)=>{const p=b.toW(x,z);solidCircle(p[0],p[1],r)};
  const c1=b.toW(-b.w/2,-b.d/2),c2=b.toW(b.w/2,b.d/2);
  b.rect={x1:Math.min(c1[0],c2[0]),x2:Math.max(c1[0],c2[0]),z1:Math.min(c1[1],c2[1]),z2:Math.max(c1[1],c2[1])};
  b.group=new THREE.Group();b.group.position.set(b.x,0,b.z);b.group.rotation.y=b.rot;scene.add(b.group);
  b.upperGroup=new THREE.Group();b.group.add(b.upperGroup);
  b.S=new Batch();b.U=new Batch();b.I=new Batch();b.O=new Batch();b.fadeMats=[];b.fade=1;b.fadeTransparent=false;
  b.ix1=-b.w/2+b.t;b.ix2=b.w/2-b.t;b.iz1=-b.d/2+b.t;b.iz2=b.fz-b.t;
  envelope(b);
  if(b.enterable)interiorShell(b);
  if(b.upperBlock&&b.floors>1)b.U.box(b.w,b.H-b.gH,b.d,b.upperKey||'plaster',b.upperCol||b.wallCol,0,(b.gH+b.H)/2,0);
  if(b.facade)b.facade(b);
  roofOf(b);
  if(b.sign){const s=b.sign;const m=signMesh(signTexture({title:s.title,sub:s.sub,bg:s.bg,fg:s.fg,accent:s.accent}),s.w||b.w-1.6,s.h||1.4,s.glow??.3);m.position.set(s.x||0,s.y||b.gH+1.0,s.z??b.d/2+.42);if(s.ry)m.rotation.y=s.ry;b.upperGroup.add(m);b.fadeMats.push(m.material)}
  if(b.interior)b.interior(b,furn(b,b.I));
  if(b.outside)b.outside(b,furn(b,b.O));
  if(b.ev){const [x,z]=b.ev;b.I.box(1.0,1.1,1.0,'wood',0x4a3426,x,.55,z);b.I.box(1.18,.1,1.18,'metal',0xd4af37,x,1.12,z);b.solidC(x,z,.72);b.evPos=b.toW(x,z)}
  b.O.build(b.group);b.S.build(b.group);b.I.build(b.group);
  b.fadeMats.push(...b.U.build(b.upperGroup,{clone:true}));
  if(b.enterable){const [rx,rz]=b.toW(b.doorX,b.fz+(b.a>0?b.a*.5:2.2));b.door={x:rx,z:rz}}
  allBuildings.push(b);if(b.enterable)enterables.push(b);if(b.mission)buildings.push(b);
  return b;
}
function envelope(b){

  const sd=fz+d/2;
  S.box(t,gH,sd,b.wallKey,wc,-w/2+t/2,gH/2,(fz-d/2)/2);
  S.box(t,gH,sd,b.wallKey,wc,w/2-t/2,gH/2,(fz-d/2)/2);
  b.solid(-w/2,w/2,-d/2,-d/2+t);b.solid(-w/2,-w/2+t,-d/2,fz);b.solid(w/2-t,w/2,-d/2,fz);
  const zc=fz-t/2;

    const ops=(b.frontWindows||[]).map(wd=>({x1:wd[0]-wd[1]/2,x2:wd[0]+wd[1]/2,y1:wd[2],y2:wd[2]+wd[3]}));

    S.sph(.09,'metal',0xd8b45a,b.doorX+.9,2.1,zc+.18);
    b.solid(-w/2,w/2,fz-t,fz);return;
  }
  const L=b.doorX-b.dw/2,R=b.doorX+b.dw/2;
  if(b.front==='shop'||b.front==='office'){
    for(const [x1,x2,outer] of [[-w/2,L,-1],[R,w/2,1]]){
      if(x2-x1<.25)continue;
      const pier=.6,px=outer<0?x1+pier/2:x2-pier/2;
      S.box(pier,gH,t+.08,b.wallKey,b.trimCol,px,gH/2,zc);
      const g1=outer<0?x1+pier:x1,g2=outer<0?x2:x2-pier,base=b.front==='office'?.3:.7,gh=b.dh-base;
      S.box(g2-g1,base,t,'plaster',b.baseCol||0x6d6a66,(g1+g2)/2,base/2,zc);
      S.box(g2-g1,gh,.1,'glass',0xbfe3ef,(g1+g2)/2,base+gh/2,zc);
      const n=Math.max(1,Math.round((g2-g1)/2.4));
      for(let i=0;i<=n;i++){const mx=Math.min(g2-.06,Math.max(g1+.06,g1+(g2-g1)*i/n));S.box(.12,gh,.22,'metal',frame,mx,base+gh/2,zc)}
      S.box(g2-g1,.14,.24,'metal',frame,(g1+g2)/2,b.dh,zc);S.box(g2-g1,.1,.24,'metal',frame,(g1+g2)/2,base,zc);
      b.solid(x1,x2,fz-t,fz);
    }

function isBlocked(x,z,ign){

  for(const w of walkers){if(ign&&ign.has(w))continue;const p=w.s.g.position;if((x-p.x)**2+(z-p.z)**2<.81)return true}

}

  for(const w of walkers){const p=w.s.g.position;if((x-p.x)**2+(z-p.z)**2<.81)out.add(w)}return out}
function staticFree(x,z){const r=.42;if(x<WORLD.x1||x>WORLD.x2||z<WORLD.z1||z>WORLD.z2)return false;
  for(const o of solids){if(o.c){const dx=x-o.x,dz=z-o.z,R=o.r+r;if(dx*dx+dz*dz<R*R)return false}else if(x>o.x1-r&&x<o.x2+r&&z>o.z1-r&&z<o.z2+r){const nx=Math.max(o.x1,Math.min(o.x2,x)),nz=Math.max(o.z1,Math.min(o.z2,z));if((x-nx)**2+(z-nz)**2<r*r)return false}}return true}

    const opts=[[sx*(hx-Math.abs(dx)),0],[0,sz*(hz-Math.abs(dz))],[-sx*(hx+Math.abs(dx)),0],[0,-sz*(hz+Math.abs(dz))]].sort((a,b)=>Math.hypot(a[0],a[1])-Math.hypot(b[0],b[1]));

function surfaceAt(x,z){if(currentInside)return currentInside.floorKey==='wood'?'wood':'tile';if(groundY(x,z)===0)return'paving';if((Math.abs(z)<6&&Math.abs(x)<120)||Math.abs(x)<6)return'paving';return'grass'}
const clock=new THREE.Clock();let frame=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05),tm=clock.elapsedTime;frame++;WORLD_TIME.value=tm;
  const open=!modal.classList.contains('hidden');
  let ix=0,iy=0;
  if(keys.w||keys.arrowup)iy+=1;if(keys.s||keys.arrowdown)iy-=1;if(keys.a||keys.arrowleft)ix-=1;if(keys.d||keys.arrowright)ix+=1;
  if(keys.q)rotateView(dt*1.8);if(keys.r)rotateView(-dt*1.8);
  if(joy.active){ix=joy.x;iy=joy.y}
  let mag=Math.min(1,Math.hypot(ix,iy));if(open)mag=0;if(mag<.12)mag=0;
  const run=keys.shift||(joy.active&&mag>.92),speed=run?14:8.5;
  const fx=Math.sin(cameraYaw),fz=Math.cos(cameraYaw),rx=-Math.cos(cameraYaw),rz=Math.sin(cameraYaw);
  let wx=rx*ix+fx*iy,wz=rz*ix+fz*iy;const wl=Math.hypot(wx,wz);if(wl>0){wx/=wl;wz/=wl}
  const k=1-Math.exp(-dt*(mag>0?10:13));vel.x+=(wx*speed*mag-vel.x)*k;vel.z+=(wz*speed*mag-vel.z)*k;
  if(Math.abs(vel.x)+Math.abs(vel.z)>.01){const [bx,bz]=moveWithCollision(vel.x*dt,vel.z*dt);if(bx)vel.x*=.6;if(bz)vel.z*=.6}
  pushOut();
  const spd=Math.hypot(vel.x,vel.z),moving=spd>.7;
   // Silence footsteps immediately when direction input is released or a modal opens.
   PixabayAudio.setWalking(mag>0&&moving);
  if(spd>.4){const want=Math.atan2(vel.x,vel.z);playerChar.facing+=Math.atan2(Math.sin(want-playerChar.facing),Math.cos(want-playerChar.facing))*Math.min(1,dt*12)}
  if(settings.follow&&!mouseDrag&&touchCam.size===0&&mag>0){const fwd=iy/Math.max(.001,Math.hypot(ix,iy));if(fwd>.3){const want=Math.atan2(wx,wz);cameraYaw+=Math.atan2(Math.sin(want-cameraYaw),Math.cos(want-cameraYaw))*Math.min(1,dt*1.8*fwd)}}
  if(moving){tutDist+=spd*dt;if(tutDist>8&&!tutMoved){tutMoved=true;Tut.event('moved')}stepPhase+=dt*spd*.95;const n=Math.floor(stepPhase/Math.PI);if(n!==lastStep){lastStep=n;Sound.play('step',surfaceAt(player.position.x,player.position.z))}}
  player.position.y+=(groundY(player.position.x,player.position.z)-player.position.y)*Math.min(1,dt*12);

  currentInside=insideBuilding(player.position.x,player.position.z);insideName=currentInside?currentInside.name:null;
  if(currentInside!==lastInside){
    if(currentInside){toast(currentInside.mission?t('toast.enter',{name:currentInside.name}):t('toast.enterCafe',{name:currentInside.name}));Sound.play('door')}
    else if(lastInside)toast(t('toast.leave'));
    lastInside=currentInside;
  }
  updateFades(dt);
  const near=nearestEvidence(3.6);actionBtn.style.display=near&&!open?'block':'none';
  for(const b of buildings){if(!b.evPos)continue;const d=Math.hypot(player.position.x-b.evPos[0],player.position.z-b.evPos[1]);if(d>3.8)b.evArmed=true;else if(d<2.6&&b.evArmed&&!open){b.evArmed=false;window.interactBuilding(b.name)}}

  updateSignals(tm);for(const l of Object.values(LANES))updateLane(l,dt);
  for(const w of walkers)updateWalker(w,dt);
  updateCamera(dt);
  playerChar.update(dt,moving,stepPhase);
  for(const p of idlers)p.s.update(dt,p.run);
  fountain.update(tm);
  for(const f of flags){const pos=f.m.geometry.attributes.position,a=pos.array,base=f.base;for(let i=0;i<pos.count;i++){const x=base[i*3],y=base[i*3+1],kk=x/4;a[i*3+2]=Math.sin(tm*4.2-x*1.6+f.ph)*.22*kk+Math.sin(tm*2.3+y*2+x)*.05*kk;a[i*3+1]=y-kk*kk*.12}pos.needsUpdate=true;f.m.geometry.computeVertexNormals()}
  for(const c of clouds){c.g.position.x+=c.v*dt;if(c.g.position.x>440)c.g.position.x=-440}
  for(const f of flocks){f.a+=f.speed*dt;const fx2=f.cx+Math.cos(f.a)*f.r,fz2=f.cz+Math.sin(f.a)*f.r,fy=f.cy+Math.sin(tm*.3)*3,hd=Math.atan2(-Math.sin(f.a)*Math.sign(f.speed),Math.cos(f.a)*Math.sign(f.speed));
    for(const b of f.birds){b.b.position.set(fx2+b.off.x,fy+b.off.y,fz2+b.off.z);b.b.rotation.y=hd;const fl=Math.sin(tm*11+b.ph)*.7;b.wings[0].rotation.z=-fl;b.wings[1].rotation.z=fl}}
  TX.waterNormal.offset.x=tm*.004;TX.waterNormal.offset.y=tm*.002;waterNormal2.offset.x=tm*.03;waterNormal2.offset.y=-tm*.02;
  updateMarkers(tm);
  sun.target.position.set(Math.round(player.position.x/2)*2,0,Math.round(player.position.z/2)*2);sun.position.copy(sun.target.position).addScaledVector(SUN_DIR,120);
  sky.position.copy(camera.position);
  renderer.render(scene,camera);
  if(frame%2===0)drawMap();
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
applyStaticLang();actionLabel();hud();highlightTarget();animate();window.openMainMenu();if(!store.get('mysteryville_tutorial_v1',false))Tut.start();
